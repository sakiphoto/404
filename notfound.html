<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - กำลังพัฒนา</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
        }
        h1 {
            font-size: 6rem;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>ฟีเจอร์นี้กำลังอยู่ในระหว่างพัฒนา</h2>
        <p>หน้าเว็บที่คุณพยายามเข้าถึงยังไม่เปิดให้บริการในขณะนี้ โปรดกลับมาตรวจสอบอีกครั้งเร็วๆ นี้ หรือกลับสู่หน้าหลักเพื่อใช้งานส่วนอื่นก่อนครับ</p>
        <a href="/" class="btn">กลับสู่หน้าแรก</a>
    </div>
</body>
</html>
